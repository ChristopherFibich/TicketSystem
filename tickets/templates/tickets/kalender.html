{% extends 'base.html' %}

{% block title %}Kalender{% endblock %}

{% block content %}
  <div class="calendar-shell">
    <div id="calendar" aria-label="Kalender"></div>
  </div>

  <style>
    .calendar-shell { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: .75rem; overflow: hidden; }
    #calendar { min-height: 42rem; padding: .75rem; }
    .fc { --fc-border-color: var(--bs-border-color); --fc-button-bg-color: var(--bs-primary); --fc-button-border-color: var(--bs-primary); --fc-button-hover-bg-color: var(--bs-primary); --fc-button-hover-border-color: var(--bs-primary); --fc-today-bg-color: rgba(var(--bs-primary-rgb), .08); font-family: inherit; }
    .fc .fc-toolbar-title { font-size: 1.15rem; font-weight: 600; }
    .fc .fc-button { border-radius: .4rem; box-shadow: none; font-size: .875rem; font-weight: 500; }
    .fc .fc-button-primary:not(:disabled).fc-button-active { background: var(--bs-primary); border-color: var(--bs-primary); }
    .fc .fc-daygrid-day-number, .fc .fc-col-header-cell-cushion { color: var(--bs-body-color); text-decoration: none; }
    .fc .fc-col-header-cell-cushion { white-space: nowrap; }
    .fc .fc-day-today .fc-daygrid-day-number { align-items: center; background: var(--bs-primary); border-radius: 50%; color: #fff; display: flex; height: 2rem; justify-content: center; margin: .25rem; width: 2rem; }
    .fc .fc-timegrid-now-indicator-line { border-color: var(--bs-danger); }
    .fc .fc-timegrid-now-indicator-arrow { border-bottom-color: var(--bs-danger); border-top-color: var(--bs-danger); }
    @media (max-width: 767.98px) {
      #calendar { min-height: 34rem; padding: .35rem; }
      .fc .fc-toolbar { align-items: flex-start; flex-wrap: wrap; gap: .5rem; }
      .fc .fc-toolbar-title { font-size: 1rem; }
      .fc .fc-toolbar-chunk { display: flex; gap: .25rem; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales-all.global.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const calendarElement = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarElement, {
        initialView: '{{ calendar_view }}',
        initialDate: '{{ selected_date|date:"Y-m-d" }}',
        locale: 'de',
        firstDay: 1,
        dayHeaderFormat: window.matchMedia('(max-width: 767.98px)').matches
          ? { weekday: 'short' }
          : { weekday: 'short', day: 'numeric', month: 'numeric' },
        nowIndicator: true,
        navLinks: true,
        editable: false,
        selectable: false,
        dayMaxEvents: true,
        scrollTime: '08:00:00',
        slotMinTime: '06:00:00',
        slotMaxTime: '23:00:00',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'tag,woche,monat',
        },
        buttonText: {
          today: 'Heute',
          month: 'Monat',
          week: 'Woche',
          day: 'Tag',
        },
        customButtons: {
          tag: { text: 'Tag', click: () => calendar.changeView('timeGridDay') },
          woche: { text: 'Woche', click: () => calendar.changeView('timeGridWeek') },
          monat: { text: 'Monat', click: () => calendar.changeView('dayGridMonth') },
        },
        dateClick: (info) => {
          if (calendar.view.type === 'dayGridMonth') {
            calendar.changeView('timeGridDay', info.dateStr);
          }
        },
        datesSet: (info) => {
          const modeByView = { timeGridDay: 'tag', timeGridWeek: 'woche', dayGridMonth: 'monat' };
          const mode = modeByView[info.view.type] || 'monat';
          const dateValue = calendar.getDate().toISOString().slice(0, 10);
          window.history.replaceState({}, '', `?mode=${mode}&date=${dateValue}`);
        },
      });
      calendar.render();
    });
  </script>
{% endblock %}
