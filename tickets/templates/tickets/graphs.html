{% extends 'base.html' %}

{% block title %}Graphs{% endblock %}

{% block content %}
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h4 m-0">Graphs</h1>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="id_show_average" checked>
        <label class="form-check-label" for="id_show_average">Show trend line + forecast</label>
      </div>
      <canvas id="weightChart" height="120"></canvas>
      <div id="trendSummary" class="small text-muted mt-2" style="display: none;"></div>
    </div>
  </div>

  <form method="post" class="card card-body">
    {% csrf_token %}

    <div class="row g-2 align-items-end">
      <div class="col-12 col-md-4">
        <label class="form-label" for="id_measured_on">Date</label>
        <input class="form-control" type="date" id="id_measured_on" name="measured_on" value="{{ default_measured_on }}" required>
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label" for="id_weight_kg">Weight (kg)</label>
        <input class="form-control" type="number" step="0.1" inputmode="decimal" id="id_weight_kg" name="weight_kg" required>
      </div>
      <div class="col-12 col-md-4 d-grid">
        <button class="btn btn-primary" type="submit">Add</button>
      </div>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" crossorigin="anonymous"></script>
  <script>
    (function () {
      const labels = {{ labels_json|safe }};
      const data = {{ weights_json|safe }};

      const ctx = document.getElementById('weightChart');
      if (!ctx) return;

      const parseISODateUTC = (isoDate) => new Date(isoDate + 'T00:00:00Z');
      const formatMonthDay = (isoDate) => {
        const d = parseISODateUTC(isoDate);
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const m = months[d.getUTCMonth()] || '';
        const day = d.getUTCDate();
        return `${m}-${day}`;
      };
      const addDaysISO = (isoDate, days) => {
        const d = parseISODateUTC(isoDate);
        const ms = d.getTime() + days * 24 * 60 * 60 * 1000;
        const out = new Date(ms);
        return out.toISOString().slice(0, 10);
      };

      const forecastWeeks = 4;
      const forecastStepDays = 7;
      const forecastDays = forecastWeeks * forecastStepDays;

      const extendedLabels = labels.slice();
      if (labels.length >= 1) {
        const last = labels[labels.length - 1];
        for (let d = forecastStepDays; d <= forecastDays; d += forecastStepDays) {
          extendedLabels.push(addDaysISO(last, d));
        }
      }

      const weightExtended = data.concat(Array(Math.max(0, extendedLabels.length - data.length)).fill(null));

      // Linear regression trend line: weight = a + b * tDays
      // where tDays is days since first measurement.
      const trendData = extendedLabels.map(() => null);
      let slope = null;
      let intercept = null;
      if (labels.length >= 2 && data.length === labels.length) {
        const t0 = parseISODateUTC(labels[0]).getTime();
        const xs = labels.map(l => (parseISODateUTC(l).getTime() - t0) / (1000 * 60 * 60 * 24));
        const ys = data;

        const n = xs.length;
        const sumX = xs.reduce((a, v) => a + v, 0);
        const sumY = ys.reduce((a, v) => a + v, 0);
        const sumXX = xs.reduce((a, v) => a + v * v, 0);
        const sumXY = xs.reduce((a, v, i) => a + v * ys[i], 0);

        const denom = (n * sumXX - sumX * sumX);
        if (denom !== 0) {
          slope = (n * sumXY - sumX * sumY) / denom;
          intercept = (sumY - slope * sumX) / n;

          for (let i = 0; i < extendedLabels.length; i++) {
            const x = (parseISODateUTC(extendedLabels[i]).getTime() - t0) / (1000 * 60 * 60 * 24);
            trendData[i] = intercept + slope * x;
          }
        }
      }

      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: extendedLabels,
          datasets: [{
            label: 'Weight (kg)',
            data: weightExtended,
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 3,
          }, {
            label: 'Trend (kg)',
            data: trendData,
            borderWidth: 2,
            borderDash: [6, 6],
            pointRadius: 0,
            tension: 0,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: true },
            tooltip: {
              callbacks: {
                title: (items) => {
                  if (!items || items.length === 0) return '';
                  const label = items[0].label;
                  return formatMonthDay(label);
                }
              }
            },
          },
          scales: {
            x: {
              title: { display: true, text: 'Time' },
              ticks: {
                callback: (value, index) => {
                  const raw = extendedLabels[index];
                  return raw ? formatMonthDay(raw) : value;
                }
              }
            },
            y: { title: { display: true, text: 'kg' } },
          }
        }
      });

      const toggle = document.getElementById('id_show_average');
      if (!toggle) return;

      const summaryEl = document.getElementById('trendSummary');

      if (labels.length < 2 || slope === null || intercept === null) {
        toggle.checked = false;
        toggle.disabled = true;

        if (summaryEl) {
          summaryEl.style.display = 'block';
          summaryEl.textContent = 'Add at least 2 entries to calculate a trend line.';
        }
      }

      const setAverageVisible = (visible) => {
        // Dataset 1 is the trend line.
        chart.setDatasetVisibility(1, !!visible);
        chart.update();

        if (!summaryEl) return;
        if (!visible) {
          summaryEl.style.display = 'none';
          return;
        }

        if (slope === null || intercept === null || labels.length < 2) {
          summaryEl.style.display = 'block';
          summaryEl.textContent = 'Add at least 2 entries to calculate a trend line.';
          return;
        }

        const slopePerDay = slope;
        const slopePerWeek = slopePerDay * 7;

        const t0 = parseISODateUTC(labels[0]).getTime();
        const lastX = (parseISODateUTC(labels[labels.length - 1]).getTime() - t0) / (1000 * 60 * 60 * 24);
        const predIn4w = intercept + slopePerDay * (lastX + forecastDays);

        summaryEl.style.display = 'block';
        summaryEl.textContent = `Trend ≈ ${slopePerDay.toFixed(3)} kg/day (≈ ${slopePerWeek.toFixed(2)} kg/week). If it continues: ~${predIn4w.toFixed(1)} kg in ${forecastWeeks} weeks.`;
      };

      setAverageVisible(toggle.checked);
      toggle.addEventListener('change', () => setAverageVisible(toggle.checked));
    })();
  </script>
{% endblock %}
